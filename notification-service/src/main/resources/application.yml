spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: maxs_pay
    password: maxs_pay
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
server:
  port: 8087
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
